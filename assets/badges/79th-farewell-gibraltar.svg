<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128" role="img" aria-labelledby="title desc">
  <title id="title">79th's Farewell to Gibraltar</title>
  <desc id="desc">A lightweight badge with a marching Scottish piper and the Rock of Gibraltar.</desc>
  <circle cx="64" cy="64" r="60" fill="#0f376f"/>
  <circle cx="64" cy="64" r="56" fill="#efc24d"/>
  <circle cx="64" cy="64" r="51" fill="#5fb3e8"/>

  <!-- Rock of Gibraltar -->
  <path d="M54 70 Q59 54 65 42 Q73 28 81 36 Q87 42 92 55 Q98 68 111 75 L111 87 L52 87 Z"
        fill="#7b858d" stroke="#3d4b57" stroke-width="2"/>
  <path d="M60 68 Q66 52 72 41 Q77 34 82 40 Q85 44 88 53"
        fill="none" stroke="#d6d9dc" stroke-width="4" stroke-linecap="round"/>
  <path d="M81 40 Q88 45 94 54" fill="none" stroke="#5c6c75" stroke-width="3"/>

  <!-- Sea -->
  <path d="M13 86 Q30 82 47 86 T81 86 T115 86 L115 104 L13 104 Z" fill="#2479b8"/>
  <path d="M18 92 Q33 89 48 92 T78 92 T108 92" fill="none" stroke="#9fd4ef" stroke-width="2"/>

  <!-- Gibraltar town/fort -->
  <g fill="#e7dfc9" stroke="#8f7959" stroke-width="1">
    <rect x="78" y="75" width="10" height="9"/>
    <rect x="89" y="73" width="13" height="11"/>
    <rect x="103" y="76" width="7" height="8"/>
    <rect x="95" y="68" width="5" height="16"/>
  </g>

  <!-- Marching Scottish piper -->
  <g transform="translate(20 30)">
    <circle cx="23" cy="14" r="6" fill="#e4b48d"/>
    <path d="M15 11 q8-9 16 0 l-1-6 -5-3 -5 2 -5 3z" fill="#15191d"/>
    <circle cx="27" cy="4" r="2" fill="#c93131"/>
    <ellipse cx="12" cy="25" rx="7" ry="10" fill="#171b20"/>
    <path d="M10 17 L2 0 M14 18 L11 -5 M18 20 L22 2"
          stroke="#171b20" stroke-width="3.5" stroke-linecap="round"/>
    <path d="M2 0 h4 M11 -5 h4 M22 2 h4" stroke="#f3eee0" stroke-width="2.5"/>

    <path d="M17 22 q8-4 16 2 l3 30 -15 0z" fill="#c12f36"/>
    <path d="M10 31 L21 24 L29 56 L7 65 Z" fill="#203d68"/>
    <path d="M10 35 L25 27 M9 43 L27 34 M8 51 L29 41 M8 59 L31 48"
          stroke="#b52f35" stroke-width="2"/>

    <path d="M21 54 l-7 21 h7 l7-20z" fill="#171b20"/>
    <path d="M32 54 l8 18 h7 l-8-21z" fill="#171b20"/>
    <rect x="13" y="71" width="9" height="5" fill="#f5f5ef"/>
    <rect x="39" y="68" width="9" height="5" fill="#f5f5ef"/>
    <path d="M13 76 q5 3 10 0" fill="none" stroke="#111" stroke-width="3"/>
    <path d="M39 73 q5 3 10 0" fill="none" stroke="#111" stroke-width="3"/>
  </g>

  <!-- banner -->
  <path d="M21 99 Q64 108 107 99 L101 117 Q64 123 27 117 Z"
        fill="#f5e7bd" stroke="#0f376f" stroke-width="2.5"/>
  <text x="64" y="108" text-anchor="middle"
        font-family="Arial,Helvetica,sans-serif" font-weight="700" font-size="8.2" fill="#0f376f">
    79th's FAREWELL
  </text>
  <text x="64" y="116" text-anchor="middle"
        font-family="Arial,Helvetica,sans-serif" font-weight="700" font-size="8.2" fill="#0f376f">
    TO GIBRALTAR
  </text>

  <!-- thistle -->
  <path d="M58 122 l4-10 4 10 -4 5z M67 122 l4-10 4 10 -4 5z" fill="#7b3fa1"/>
  <path d="M52 126 q9-8 17 0 q9-8 17 0" fill="none" stroke="#2f7a3d" stroke-width="4" stroke-linecap="round"/>
</svg>