<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128" role="img" aria-labelledby="title desc">
  <title id="title">Regular Piper</title>
  <desc id="desc">A schematic side-profile piper with a Glengarry, simple hands and a black practice chanter.</desc>

  <circle cx="64" cy="64" r="60" fill="#8a4f24"/>
  <circle cx="64" cy="64" r="56" fill="#f2c24f"/>
  <circle cx="64" cy="64" r="51" fill="#bfe8ff"/>

  <path d="M13 73 Q34 59 55 69 T114 65 L114 108 L13 108 Z" fill="#69a755"/>
  <path d="M13 88 Q36 76 57 85 T114 81 L114 108 L13 108 Z" fill="#3e7f48"/>

  <!-- Glengarry -->
  <path d="M26 31 Q42 19 65 20 Q80 21 91 28 L87 39 Q60 31 35 43 Z" fill="#171d29"/>
  <circle cx="50" cy="20" r="4" fill="#d8332f"/>
  <path d="M31 39 Q50 31 86 35" fill="none" stroke="#0e131c" stroke-width="4" stroke-linecap="round"/>
  <path d="M29 39 L24 61 L34 54 L36 39 Z" fill="#171d29"/>

  <!-- head, no hair -->
  <path d="M39 39
           Q49 32 62 34
           Q73 36 79 45
           L84 51
           Q88 55 82 58
           L77 59
           Q75 66 68 70
           Q58 74 49 69
           Q41 64 38 55
           Q36 46 39 39 Z"
        fill="#e8ae80"
        stroke="#171d29"
        stroke-width="3"
        stroke-linejoin="round"/>

  <!-- simple black body silhouette -->
  <path d="M35 69
           Q45 64 56 69
           Q68 76 74 90
           L76 110
           L24 110
           Q23 88 35 69 Z"
        fill="#171d29"/>

  <!-- chanter clearly from mouth -->
  <path d="M77 58 L100 88" stroke="#11151d" stroke-width="6" stroke-linecap="round"/>
  <path d="M99 87 L106 96" stroke="#11151d" stroke-width="6" stroke-linecap="round"/>
  <path d="M103 97 Q108 100 112 96" fill="none" stroke="#11151d" stroke-width="5" stroke-linecap="round"/>

  <!-- hands -->
  <ellipse cx="79" cy="78" rx="8" ry="6" transform="rotate(35 79 78)" fill="#e8ae80" stroke="#171d29" stroke-width="2"/>
  <ellipse cx="88" cy="90" rx="8" ry="6" transform="rotate(35 88 90)" fill="#e8ae80" stroke="#171d29" stroke-width="2"/>

  <!-- simple finger indication -->
  <path d="M76 76 l6 4 M85 88 l6 4" stroke="#171d29" stroke-width="1.5" stroke-linecap="round"/>
</svg>