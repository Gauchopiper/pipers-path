<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="referrer" content="no-referrer">
  <meta name="theme-color" content="#ffffff">
  <title>Piper's Path</title>
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="icon-192.png">
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: Arial, Helvetica, sans-serif;
      background: #f5f5f5;
      color: #222;
      min-height: 100vh;
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
    }
    header {
      background: #fff;
      padding: 18px 16px 12px;
      text-align: center;
      border-bottom: 1px solid #ddd;
    }
    h1 { margin: 0; font-size: 28px; }
    #identity { margin-top: 6px; font-size: 16px; color: #555; }

    main {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px 20px 110px;
      width: 100%;
    }

    .view { display: none; width: 100%; max-width: 520px; }
    .view.active { display: block; }

    #recordView { text-align: center; }

    #timer {
      font-size: 56px;
      font-weight: 700;
      letter-spacing: 1px;
      margin: 10px 0 28px;
      font-variant-numeric: tabular-nums;
    }

    #recordButton {
      width: 210px;
      height: 210px;
      border: 0;
      border-radius: 50%;
      font-size: 28px;
      font-weight: 700;
      background: #c62828;
      color: #fff;
      box-shadow: 0 8px 24px rgba(0,0,0,.22);
      cursor: pointer;
      touch-action: manipulation;
    }
    #recordButton.recording { background: #222; }

    #status {
      margin-top: 24px;
      min-height: 26px;
      font-size: 18px;
    }

    #playbackWrap {
      display: none;
      margin: 28px auto 0;
      max-width: 420px;
    }
    audio { width: 100%; }

    .card {
      background: #fff;
      border-radius: 18px;
      padding: 22px;
      box-shadow: 0 4px 16px rgba(0,0,0,.08);
    }

    .empty {
      text-align: center;
      color: #666;
      line-height: 1.5;
    }

    nav {
      position: fixed;
      left: 0;
      right: 0;
      bottom: 0;
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      background: #fff;
      border-top: 1px solid #ccc;
      padding-bottom: env(safe-area-inset-bottom);
      z-index: 10;
    }

    .navButton {
      border: 0;
      background: #fff;
      min-height: 82px;
      padding: 8px 4px;
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
    }
    .navButton .icon {
      display: block;
      font-size: 31px;
      line-height: 1.1;
      margin-bottom: 5px;
    }
    .navButton.active { background: #e9e9e9; }

    .small {
      font-size: 13px;
      color: #777;
      margin-top: 8px;
      word-break: break-all;
    }

    .warning {
      background: #fff3cd;
      border: 1px solid #ffe69c;
      padding: 12px;
      border-radius: 10px;
      margin-top: 16px;
      font-size: 14px;
      text-align: left;
    }
  </style>
</head>

<body>
<header>
  <h1>Piper's Path</h1>
  <div id="identity">Loading pupil link…</div>
</header>

<main>
  <section id="recordView" class="view active">

    <div id="practiceTargetWrap" style="margin:0 auto 18px; max-width:320px; text-align:left;">
  <label for="practiceTarget" style="display:block; font-weight:700; margin-bottom:6px;">
    Practice for:
  </label>

  <select id="practiceTarget" style="
    width:100%;
    padding:12px;
    font-size:16px;
    border:1px solid #ccc;
    border-radius:10px;
    background:#fff;
  ">
    <option value="">General practice</option>
  </select>
      
      <div id="targetStatus" style="margin-top:6px; font-size:14px;"></div>
      
</div>
    <div id="timer">00:00</div>
    <button id="recordButton" type="button">RECORD</button>
    <div id="status">Tap RECORD to begin</div>
<div id="playbackWrap">
  <p><strong>Your recording</strong></p>
  <audio id="playback" controls></audio>
</div>
</div>
    </div>
  </section>

 <section id="pathView" class="view">
  <div class="card">
    <h2>📈 Piper's Path</h2>

    <div id="pathStatus">Loading your practice history…</div>

    <div id="pathSummary" style="display:none; margin-top:20px;">
      <p><strong>Total sessions:</strong> <span id="pathTotalSessions">0</span></p>
      <p><strong>Qualifying sessions:</strong> <span id="pathQualifyingSessions">0</span></p>
      <p><strong>Total practice:</strong> <span id="pathTotalMinutes">0</span> min</p>
    </div>

   <div id="pathTargets" style="margin-top:24px;"></div>
<div id="pathBadges" style="margin-top:24px;"></div>
<div id="pathSessions" style="margin-top:24px;"></div>
  </div>
</section>

  <section id="groupView" class="view">
    <div class="card">
      <h2>👥 Group</h2>
      <p class="empty">
        The Community Bagpipe will appear here once the shared daily data is connected.
      </p>
    </div>
  </section>
</main>

<nav>
  <button class="navButton active" data-view="recordView">
    <span class="icon">🎙️</span>
    RECORD
  </button>
  <button class="navButton" data-view="pathView">
    <span class="icon">📈</span>
    PATH
  </button>
  <button class="navButton" data-view="groupView">
    <span class="icon">👥</span>
    GROUP
  </button>
</nav>

<script>
  const BACKEND_URL = 'https://script.google.com/macros/s/AKfycbwZRT0eDd5xV_onNptruSfu6x3rvYPWBEf1kBvfC2fjXi8FWuv5V4KI0JATPoN6GGZ--Q/exec';
  const params = new URLSearchParams(location.search);
  const pupilId = params.get('p') || '';
  const accessKey = params.get('key') || '';
  const displayName = (params.get('n') || pupilId).trim();

  const identity = document.getElementById('identity');
  if (pupilId && accessKey) {
    identity.textContent = displayName;
  } else {
    identity.textContent = 'Test mode — no pupil link supplied';
  }
const practiceTarget = document.getElementById('practiceTarget');

async function loadPracticeTargets() {
  // Always keep General practice as the first/default choice.
  practiceTarget.innerHTML = '';

  const generalOption = document.createElement('option');
  generalOption.value = '';
  generalOption.textContent = 'General practice';
  practiceTarget.appendChild(generalOption);

  if (!pupilId || !accessKey) return;

  try {
    const response = await fetch(BACKEND_URL, {
      method: 'POST',
      headers: {
        'Content-Type': 'text/plain;charset=utf-8'
      },
      body: JSON.stringify({
        action: 'getPath',
        pupilId: pupilId,
        accessKey: accessKey
      })
    });

    const data = await response.json();

    if (!data.ok) {
      throw new Error(data.error || 'Could not load targets.');
    }

    const eligibleTargets = (data.targets || []).filter(target => {
      const status = String(target.status || '').trim().toUpperCase();

      return (
        status === 'IN PROGRESS' ||
        status === 'READY FOR REVIEW'
      );
    });

    eligibleTargets.forEach(target => {
      const option = document.createElement('option');
      option.value = target.targetId;
      option.textContent = target.title;
      practiceTarget.appendChild(option);
    });

  } catch (error) {
    console.error('Practice target load error:', error);
  }
}

if (pupilId && accessKey) {
  loadPracticeTargets();
}
  const targetStatus = document.getElementById('targetStatus');

async function tagSavedRecording(fileUrl, targetId) {
  targetStatus.textContent = '';

  // Blank target means General practice.
  if (!targetId) {
    return true;
  }

  try {
    // Write the target link.
    // We do not trust/read this response because Apps Script redirects
    // have been unreliable specifically for setSessionTarget.
    await fetch(BACKEND_URL, {
      method: 'POST',
      mode: 'no-cors',
      headers: {
        'Content-Type': 'text/plain;charset=utf-8'
      },
      body: JSON.stringify({
        action: 'setSessionTarget',
        pupilId: pupilId,
        accessKey: accessKey,
        driveFileLink: fileUrl,
        targetId: targetId
      })
    });

    // Confirm the actual saved state using the proven getPath read.
    const confirmResponse = await fetch(BACKEND_URL, {
      method: 'POST',
      headers: {
        'Content-Type': 'text/plain;charset=utf-8'
      },
      body: JSON.stringify({
        action: 'getPath',
        pupilId: pupilId,
        accessKey: accessKey
      })
    });

    const data = await confirmResponse.json();

    if (!data.ok) {
      throw new Error(data.error || 'Could not confirm target.');
    }

    const savedSession = (data.sessions || []).find(
      session => session.driveFileLink === fileUrl
    );

    if (savedSession && savedSession.targetId === targetId) {
      targetStatus.textContent = 'Target saved ✓';
      return true;
    }

    targetStatus.textContent =
      'Recording saved — target could not be confirmed';
    return false;

  } catch (error) {
    console.error('Target tagging error:', error);
    targetStatus.textContent =
      'Recording saved — target could not be confirmed';
    return false;
  }
}
  const navButtons = document.querySelectorAll('.navButton');
  const views = document.querySelectorAll('.view');

  navButtons.forEach(btn => {
    btn.addEventListener('click', () => {
      navButtons.forEach(b => b.classList.remove('active'));
      views.forEach(v => v.classList.remove('active'));
      btn.classList.add('active');
      document.getElementById(btn.dataset.view).classList.add('active');
      
 if (btn.dataset.view === 'pathView') {
  loadPath();
}
});
});

  let mediaRecorder = null;
  let stream = null;
  let chunks = [];
  let recording = false;
  let startedAt = null;
  let timerHandle = null;
  let lastObjectUrl = null;

  const recordButton = document.getElementById('recordButton');
  const statusEl = document.getElementById('status');
  const timerEl = document.getElementById('timer');
  const playbackWrap = document.getElementById('playbackWrap');
  const playback = document.getElementById('playback');

  function formatTime(totalSeconds) {
    const minutes = Math.floor(totalSeconds / 60);
    const seconds = totalSeconds % 60;
    return String(minutes).padStart(2, '0') + ':' + String(seconds).padStart(2, '0');
  }

  function updateTimer() {
    if (!startedAt) return;
    const seconds = Math.floor((Date.now() - startedAt) / 1000);
    timerEl.textContent = formatTime(seconds);
  }

  async function startRecording() {
    if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
      statusEl.textContent = 'This browser does not support microphone recording.';
      return;
    }

    try {
      stream = await navigator.mediaDevices.getUserMedia({ audio: true });
      chunks = [];

      let options = {};
      const preferred = [
        'audio/webm;codecs=opus',
        'audio/webm',
        'audio/mp4'
      ];

      for (const type of preferred) {
        if (window.MediaRecorder && MediaRecorder.isTypeSupported && MediaRecorder.isTypeSupported(type)) {
          options = { mimeType: type };
          break;
        }
      }

      mediaRecorder = new MediaRecorder(stream, options);

      mediaRecorder.addEventListener('dataavailable', e => {
        if (e.data && e.data.size > 0) chunks.push(e.data);
      });

      mediaRecorder.addEventListener('stop', () => {
        const type = mediaRecorder.mimeType || 'audio/webm';
        const blob = new Blob(chunks, { type });

        if (lastObjectUrl) URL.revokeObjectURL(lastObjectUrl);
        lastObjectUrl = URL.createObjectURL(blob);

        playback.src = lastObjectUrl;
        playbackWrap.style.display = 'block';
        statusEl.textContent = 'Saving recording…';
        uploadRecording(blob, type);

        if (stream) {
          stream.getTracks().forEach(track => track.stop());
          stream = null;
        }
      });

      mediaRecorder.start();
      recording = true;
      startedAt = Date.now();
      playbackWrap.style.display = 'none';
      timerEl.textContent = '00:00';
      recordButton.textContent = 'STOP';
      recordButton.classList.add('recording');
      statusEl.textContent = 'Recording…';
      updateTimer();
      timerHandle = setInterval(updateTimer, 500);

    } catch (err) {
      console.error(err);
      if (err && err.name === 'NotAllowedError') {
        statusEl.textContent = 'Microphone permission was denied.';
      } else if (err && err.name === 'NotFoundError') {
        statusEl.textContent = 'No microphone was found.';
      } else {
        statusEl.textContent = 'Could not start the microphone.';
      }
    }
  }

function stopRecording() {

  if (!recording) return;

  recording = false;

  const stoppedAt = Date.now();

  if (timerHandle) {
    clearInterval(timerHandle);
    timerHandle = null;
  }

  const elapsedSeconds =
    Math.floor((stoppedAt - startedAt) / 1000);

  timerEl.textContent = formatTime(elapsedSeconds);

  recordButton.textContent = 'RECORD';
  recordButton.classList.remove('recording');

  if (mediaRecorder && mediaRecorder.state !== 'inactive') {
    mediaRecorder.stop();
  }

  if (stream) {
    stream.getTracks().forEach(track => track.stop());
    stream = null;
  }
}

  recordButton.addEventListener('click', () => {
    if (recording) stopRecording();
    else startRecording();
  });

  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('./service-worker.js').catch(console.error);
    });
  }async function uploadRecording(blob, mimeType) {
  try {
    if (!pupilId || !accessKey) {
      statusEl.textContent =
        'Recording complete, but no pupil link was supplied.';
      return;
    }

    const base64 = await blobToBase64(blob);

    const endTime = new Date();
    const durationSeconds =
     Math.floor((endTime.getTime() - startedAt) / 1000);

    const payload = {
      pupilId: pupilId,
      accessKey: accessKey,
      audioBase64: base64,
      mimeType: mimeType,
      startIso: new Date(startedAt).toISOString(),
      endIso: endTime.toISOString(),
      durationSeconds: durationSeconds
    };

    const response = await fetch(BACKEND_URL, {
      method: 'POST',
      headers: {
        'Content-Type': 'text/plain;charset=utf-8'
      },
      body: JSON.stringify(payload)
    });

    const result = await response.json();

    if (result.ok) {
      statusEl.textContent =
        result.qualifying === 'Yes'
          ? 'Practice saved ✓'
          : 'Recording saved ✓';
      const selectedTargetId = practiceTarget.value;

if (selectedTargetId) {
  tagSavedRecording(result.fileUrl, selectedTargetId);
} else {
  targetStatus.textContent = '';
}
      
    } else {
      statusEl.textContent =
        'Could not save: ' + result.error;
    }

  } catch (err) {
    console.error(err);

    statusEl.textContent =
      'Recording made, but the upload could not be confirmed.';
  }
}


function blobToBase64(blob) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();

    reader.onloadend = () => {
      const dataUrl = reader.result;
      const base64 = dataUrl.split(',')[1];
      resolve(base64);
    };

    reader.onerror = reject;

    reader.readAsDataURL(blob);
  });
}
  async function loadPath() {
  const pathStatus = document.getElementById('pathStatus');
  const pathSummary = document.getElementById('pathSummary');
  const pathSessions = document.getElementById('pathSessions');

  pathStatus.textContent = 'Loading your practice history…';
  pathSummary.style.display = 'none';
  pathSessions.innerHTML = '';

  try {
    const response = await fetch(BACKEND_URL, {
      method: 'POST',
      headers: {
        'Content-Type': 'text/plain;charset=utf-8'
      },
      body: JSON.stringify({
        action: 'getPath',
        pupilId: pupilId,
        accessKey: accessKey
      })
    });

    const data = await response.json();

    if (!data.ok) {
      throw new Error(data.error || 'Could not load PATH.');
    }

    document.getElementById('pathTotalSessions').textContent =
      data.summary.totalSessions;

    document.getElementById('pathQualifyingSessions').textContent =
      data.summary.qualifyingSessions;

    document.getElementById('pathTotalMinutes').textContent =
      Number(data.summary.totalMinutes).toFixed(2);

    pathSummary.style.display = 'block';
    pathStatus.textContent = '';
const pathTargets = document.getElementById('pathTargets');

if (data.targets && data.targets.length > 0) {
  pathTargets.innerHTML = data.targets.map(target => `
    <div style="
      padding:16px;
      border:1px solid #ddd;
      border-radius:12px;
      margin-bottom:16px;
    ">
      <strong>🎯 ${target.title}</strong><br>
      <span>${target.status}</span>
    </div>
  `).join('');
} else {
  pathTargets.innerHTML = '';
}
    const pathBadges = document.getElementById('pathBadges');

if (data.badges && data.badges.length > 0) {
  pathBadges.innerHTML =
    '<h3>Badges</h3>' +
    data.badges.map(badge => `
      <div style="
        padding:16px;
        border:1px solid #ddd;
        border-radius:12px;
        margin-bottom:16px;
      ">
  ${badge.imageLink ? `
    <img
      src="${badge.imageLink}"
      alt="${badge.badgeName}"
      style="
        width:60px;
        height:60px;
        object-fit:contain;
        display:block;
        margin-bottom:10px;
      "
    >
  ` : ''}

  <strong>${badge.badgeName}</strong><br>
  <span>${badge.description}</span>
      </div>
    `).join('');
} else {
  pathBadges.innerHTML = '';
}
    if (!data.sessions || data.sessions.length === 0) {
      pathSessions.innerHTML = '<p>No practice sessions yet.</p>';
      return;
    }

    const recent = data.sessions.slice(0, 10);

    pathSessions.innerHTML =
      '<h3>Recent practice</h3>' +
      recent.map(session => {
        const date = session.endTime || session.date;
        const when = date
          ? new Date(date).toLocaleString()
          : '';

        const duration =
          Number(session.durationMinutes || 0).toFixed(2);

        const qualifying =
          session.qualifying ? ' ✓' : '';

        return `
          <div style="
            padding:12px 0;
            border-bottom:1px solid #ddd;
          ">
            <strong>${when}</strong><br>
            ${duration} min${qualifying}
          </div>
        `;
      }).join('');

  } catch(error) {
  console.error('PATH load error:', error);
  pathStatus.textContent='Could not load your practice history.';
}
}
</script>
</body>
</html>
