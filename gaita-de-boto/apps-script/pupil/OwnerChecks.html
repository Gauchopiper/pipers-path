<!doctype html><html><head><base target="_top"><meta name="viewport" content="width=device-width,initial-scale=1"><style>body{font:16px system-ui;max-width:780px;margin:24px auto;padding:16px}button,input{padding:10px;margin:8px}pre{white-space:pre-wrap;overflow-wrap:anywhere}label{display:block}</style></head><body>
<h1>Gaita Owner verification</h1><p>Owner-only test controls. No new pupil. Audio fixtures must be labelled; no badge awards.</p>
<button id="path">Read pupil history/comments</button><button id="group">Read group</button><button id="invalid">Check wrong pupil key</button>
<label>Session ID <input id="sid" size="40"></label><button id="state">Read recording state</button>
<label>Audio file <input id="audio" type="file" accept="audio/*"></label>
<button id="send">Submit selected file / replay same Session ID</button><button id="lost">Submit but discard first success response, then query state</button>
<p id="status" role="status">Loading private link…</p><pre id="result"></pre>
<script>
let credentials={},busy=false;
const $=id=>document.getElementById(id);
google.script.url.getLocation(loc=>{const p=new URLSearchParams(loc.hash||'');credentials={pupilId:p.get('p')||'',accessKey:p.get('key')||''};$('status').textContent=credentials.pupilId&&credentials.accessKey?'Private pupil link loaded.':'No private pupil link supplied.';});
function rpc(payload){return new Promise((resolve,reject)=>google.script.run.withSuccessHandler(resolve).withFailureHandler(e=>reject(Error(e.message||'Owner RPC failed'))).gdb_testRequest({...credentials,...payload}));}
async function run(fn){if(busy)return;busy=true;$('status').textContent='Checking…';try{const r=await fn();$('result').textContent=JSON.stringify(r,null,2);$('status').textContent=r.ok?'Server response received.':'Server rejected request.';}catch(e){$('status').textContent=e.message;}finally{busy=false;}}
$('path').onclick=()=>run(()=>rpc({action:'getPath'}));
$('group').onclick=()=>run(()=>rpc({action:'getGroup'}));
$('invalid').onclick=()=>run(()=>rpc({action:'getPath',accessKey:'incorrect-test-key'}));
$('state').onclick=()=>run(()=>rpc({action:'getRecordingState',sessionId:$('sid').value.trim()}));
async function upload(drop){
 const file=$('audio').files[0];if(!file)throw Error('Select an actual audio file first.');
 const sessionId=$('sid').value.trim();if(!sessionId)throw Error('Explicit test Session ID required.');
 const a=await file.arrayBuffer(),ctx=new AudioContext();let decoded;
 try{decoded=await ctx.decodeAudioData(a.slice(0));}finally{await ctx.close();}
 const seconds=decoded.duration;
 const state=await rpc({action:'getRecordingState',sessionId});
 if(!state.ok) return state;
 if(!state.saved&&!state.retrySafe)throw Error('Uncertain receipt: stop and reconcile, do not upload.');
 const base64=await new Promise((resolve,reject)=>{const r=new FileReader();r.onload=()=>resolve(r.result.split(',')[1]);r.onerror=reject;r.readAsDataURL(file);});
 const start=new Date(),end=new Date(start.getTime()+seconds*1000);
 const result=await rpc({testFixture:true,sessionId,audioBase64:base64,mimeType:file.type||'audio/wav',startIso:start.toISOString(),endIso:end.toISOString(),durationSeconds:seconds});
 if(!drop)return {...result,clientDecodedSeconds:seconds};
 // Controlled lost-confirmation fixture: transport actually completed, but the client ignores its receipt.
 const recovered=await rpc({action:'getRecordingState',sessionId});
 return {ok:recovered.ok&&recovered.saved,test:'discarded-first-success-response',firstResponseDiscarded:true,recovered,clientDecodedSeconds:seconds};
}
$('send').onclick=()=>run(()=>upload(false));$('lost').onclick=()=>run(()=>upload(true));
</script></body></html>
