# Owner-approved 31 October 2026: one manual synthetic-only run.
# Installation may cause the separately approved automatic Pages rebuild.
name: Gaita native PostgreSQL fixtures
on:
  workflow_dispatch:
    inputs:
      approval:
        description: Type DISPOSABLE_FIXTURES_ONLY for the single approved run
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: gaita-native-postgres-fixtures
  cancel-in-progress: false
jobs:
  native-fixtures:
    if: inputs.approval == 'DISPOSABLE_FIXTURES_ONLY' && github.ref == 'refs/heads/main' && github.repository == 'Gauchopiper/pipers-path'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # reviewed v6 digest
        with:
          ref: 64545e0e76bf9ea843f4d28b8ff52ce701011d31
          fetch-depth: 0
          persist-credentials: false
      - name: Validate approved source
        env:
          GDB_APPROVED_SHA: 64545e0e76bf9ea843f4d28b8ff52ce701011d31
        run: |
          [[ "$(git rev-parse HEAD)" == "$GDB_APPROVED_SHA" ]]
          git merge-base --is-ancestor "$GDB_APPROVED_SHA" origin/feature/gaita-de-boto-staging-20261019
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # reviewed v6 digest
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Install locked test dependencies
        working-directory: gaita-de-boto/secure-access
        run: npm ci --ignore-scripts
      - name: Execute disposable native tests
        env:
          GDB_NATIVE_APPROVED: DISPOSABLE_FIXTURES_ONLY
        run: bash gaita-de-boto/secure-access/pilot-preparation/native-run.sh
      - name: Verify disposable resource cleanup
        if: always()
        run: |
          containers="$(docker ps --all --quiet --filter label=gdb.fixture=1)"
          volumes="$(docker volume ls --quiet --filter label=gdb.fixture=1)"
          if [[ -n "$containers" || -n "$volumes" ]]; then
            echo 'FAIL: labelled synthetic fixture resources remain; do not rerun.'
            docker ps --all --filter label=gdb.fixture=1
            docker volume ls --filter label=gdb.fixture=1
            exit 1
          fi
          echo 'PASS CLEANUP: no labelled fixture containers or volumes remain.'
# No Google environment/secrets, artifact uploads, dependency caches or paid runner.
# No automatic test trigger or rerun. Additional runs require separate Owner approval.
